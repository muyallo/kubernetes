apiVersion: apps/v1
kind: Deployment
metadata:
  name: webappv2
  namespace: development
  labels:
    app: webappv2
    environment: development
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webappv2
  template:
    metadata:
      labels:
        app: webappv2
        environment: development
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "300m"
              memory: "64Mi"
            limits:
              cpu: "800m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: webappv2-svc
  namespace: development
spec:
  selector:
    app: webappv2
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP