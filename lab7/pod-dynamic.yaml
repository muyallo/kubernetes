apiVersion: v1
kind: Pod
metadata:
  name: nginx-dynamic
  namespace: lab7
spec:
  containers:
    - name: nginx
      image: nginx:1.27-alpine
      volumeMounts:
        - name: web-data
          mountPath: /usr/share/nginx/html
  volumes:
    - name: web-data
      persistentVolumeClaim:
        claimName: pvc-lab7-dynamic