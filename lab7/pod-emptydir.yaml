apiVersion: v1
kind: Pod
metadata:
  name: emptydir-demo
  namespace: lab7
spec:
  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - sleep 3600
      volumeMounts:
        - name: temp-data
          mountPath: /datos
  volumes:
    - name: temp-data
      emptyDir: {}