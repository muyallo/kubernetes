---
apiVersion: v1
kind: Pod
metadata:
  name: pod-b2-webserver
  namespace: troubleshooting-lab
  labels:
    app: webserver-b2
spec:
  containers:
    - name: app
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: svc-b2-wrong-port
  namespace: troubleshooting-lab
spec:
  selector:
    app: webserver-b2
  ports:
    - port: 80
      targetPort: 9999
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-b3-liveness
  namespace: troubleshooting-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-b3
  template:
    metadata:
      labels:
        app: app-b3
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /healthz-inexistente
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: svc-b3-liveness
  namespace: troubleshooting-lab
spec:
  selector:
    app: app-b3
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Pod
